<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMOPS Meeting Record</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#DD1D21;--yel:#FBCE07;--ink:#1f2933;--grey:#6b7280;--line:#d5d9de;--bg:#f5f6f7;--green:#6BB04A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overflow-x:hidden;overflow-wrap:anywhere;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);font-family:'Jost',Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;padding-top:max(14px,env(safe-area-inset-top))!important;align-items:flex-start;gap:12px;padding:14px 16px;background:#fff;border-bottom:4px solid var(--yel)}
.logo{display:inline-block;text-align:center;line-height:1}
.logo b{display:block;font-size:26px;font-weight:500;color:var(--green)}
.logo span{display:block;background:var(--yel);color:#fff;font-size:10px;font-weight:500;padding:2px 0;margin-top:3px;text-align:justify;text-align-last:justify;letter-spacing:.2em}
h1{margin:0;font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--grey);font-size:clamp(15px,3.5vw,26px);text-align:center;flex:1;align-self:center}
.rt{text-align:right}.ver{font-size:11px;color:var(--grey);margin-bottom:3px}
.lang button{border:1px solid var(--line);background:#fff;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer;color:var(--grey)}
.lang button.on{background:var(--red);color:#fff;border-color:var(--red)}
main{width:100%;max-width:1000px;margin:0 auto;padding:14px}
@media(min-width:1100px){main{max-width:1180px;padding:20px}}
@media(min-width:1700px){main{max-width:1500px}html{font-size:17px}}
@media(min-width:2400px){main{max-width:1900px}html{font-size:19px}}
.ld{padding:40px 0;text-align:center;color:var(--grey);letter-spacing:.1em;text-transform:uppercase;font-size:13px}.sp{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spn .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes spn{to{transform:rotate(360deg)}}
.att{display:grid;grid-template-columns:1.4fr 1.4fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
@media(max-width:640px){.att{grid-template-columns:1fr 1fr}.att .ap,.att .ax{grid-column:span 1}}
.att .ax{display:flex;align-items:center;gap:6px;font-size:13px;margin:0;text-transform:none;letter-spacing:0;color:var(--ink)}.att .ax input{width:auto}
.att .pn{display:block;width:100%}
.off{border:2px solid #231f20;background:linear-gradient(180deg,#fffef9,#fff);position:relative}
.off .oh{background:#231f20;color:#fff;margin:-14px -14px 12px;padding:9px 14px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.off .decl{font-size:13.5px;line-height:1.5;border-left:4px solid var(--red);padding:6px 10px;background:#faf7f2;margin:8px 0}
.off .ck{display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}.off .ck input{width:auto;margin-top:3px}
.stamp{border:2px solid #1b7f3b;border-radius:6px;padding:8px 12px;margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:#f4fbf5;font-size:13px}
.stamp .sg{grid-row:span 4}.stamp .sg img{height:56px;max-width:180px;background:#fff;border-bottom:1px solid #231f20}
.stamp .st{color:#1b7f3b;font-weight:700;letter-spacing:.14em;font-size:12px}
.stamp .ref{font-family:monospace;font-size:11px;color:var(--grey)}
.card{min-width:0;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);margin-bottom:4px}
img,canvas,video{max-width:100%}
input,textarea,select{min-width:0;width:100%;font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff}
textarea{min-height:80px;resize:vertical}
.row textarea{min-height:44px}
h2{margin:0 0 10px;font-weight:500;font-size:17px;letter-spacing:.12em;color:var(--red)}
.btn{min-height:42px;font:inherit;border:0;border-radius:4px;padding:10px 16px;cursor:pointer;background:var(--red);color:#fff;letter-spacing:.05em;margin:4px 6px 4px 0;text-decoration:none;display:inline-block}
.mtg{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;margin:4px 0;font-weight:600;color:var(--ink)}
.mtg .tag{margin-left:0}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps div{flex:1;text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:8px 2px;background:#e9ebee;color:var(--grey)}
.steps div.on{background:var(--yel);color:var(--ink);font-weight:500}.steps div.past{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}th{background:#eceef0;font-weight:500}
tr.bad td{background:#fff3cd}
.warn{background:#fff3cd;border-left:5px solid var(--yel);padding:10px 12px;margin-bottom:14px;font-size:14px}
.okb{background:#e6f4e0;border-left:5px solid var(--green);padding:10px 12px;margin-bottom:14px;font-size:14px}
.badb{background:#fde4e4;border-left:5px solid var(--red);padding:10px 12px;margin-bottom:14px;font-size:14px}
.mut{color:var(--grey);font-size:14px}.mono{font-family:monospace;font-size:11px;word-break:break-all;color:var(--grey)}
.row{display:grid;grid-template-columns:1fr 1.2fr 1.4fr 1.2fr 32px;gap:6px;margin-top:6px}
.x{border:0;background:none;color:var(--red);font-size:20px;cursor:pointer}
canvas.pad{width:100%;height:clamp(90px,18vh,170px);border:1px dashed var(--grey);border-radius:4px;background:#fafafa;touch-action:none}
.sigimg{height:50px;display:block}
.link{font-size:12px;word-break:break-all;color:var(--grey)}
.lk{padding:8px 0;border-bottom:1px solid var(--line)}
.drop{border:2px dashed var(--line);padding:14px;text-align:center;color:var(--grey);border-radius:6px}
.drop.over{border-color:var(--red)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.thumbs img{height:80px;border-radius:4px;cursor:pointer}
#peek{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9;align-items:center;justify-content:center}
#peek img{max-width:94vw;max-height:90vh}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:center;justify-content:center}
.mbox{background:#fff;width:min(900px,96vw);max-height:96vh;max-height:96dvh;overflow-y:auto;border-radius:6px}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:3px;background:#e9ebee;margin-left:6px;text-transform:uppercase;letter-spacing:.06em}
.tag.ok{background:var(--green);color:#fff}
@media(max-width:640px){.row{grid-template-columns:1fr 32px}.row input,.row .ar,.row textarea{grid-column:1/-1}
 input,textarea,select{font-size:16px}
 header{padding:10px 12px}.logo{max-width:44vw}h1{order:3;flex:1 0 100%;letter-spacing:.14em}
 .btn{width:100%;text-align:center;margin-right:0}
 .steps div{font-size:10px;letter-spacing:.03em}
 table{font-size:13px}th,td{padding:4px}
 main{padding:10px}.card{padding:12px}}
@media(max-width:380px){.steps div{font-size:9px}h2{letter-spacing:.06em}}

</style>
</head>

/* ---------- helpers ---------- */
function pad(c){
  const x=c.getContext('2d'),r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;x.scale(2,2);x.lineWidth=2;x.lineCap='round';x.strokeStyle='#111';
  let on=false,d=false;const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{on=true;dirty=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
  c.onpointermove=e=>{if(on){d=true;x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>{on=false};
  c.clr=()=>{x.clearRect(0,0,c.width,c.height);d=false};c.has=()=>d;
}
function lowres(f){return new Promise(res=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.55))};i.src=u})}
function clashList(m){
  const rs=[],out=[];
  CODES.forEach(c=>((m.con[c]&&m.con[c].rows)||[]).forEach((r,i)=>rs.push({c,i,r,key:c+'#'+i})));
  for(let x=0;x<rs.length;x++)for(let y=x+1;y<rs.length;y++){
    const A=rs[x],B=rs[y];if(A.c===B.c)continue;let why='';
    const ka=(A.r.area||'').trim().toLowerCase(),kb=(B.r.area||'').trim().toLowerCase();
    if(ka&&ka===kb)why='area';
    if(why)out.push({a:A,b:B,why});
  }
  return out;
}

const infoCard=()=>`<div class="card"><div class="grid"><div><label>${t('host')}</label>${esc(M.host)}</div><div><label>${t('date')}</label>${esc(M.date)}</div><div><label>${t('time')}</label>${esc(M.time)}</div></div><button class="btn sec" onclick="load()">${t('refresh')}</button><button class="btn" onclick="showReadout()">${t('readout')}</button>${M.H?`<a class="btn sec" href="${BASE}?v=${M.id}">${t('verify')}</a>`:''}</div>`;
function sigLine(k){const s=M.sign&&M.sign[k];return s?`<div class="stamp"><div class="sg"><img src="${s.sign}"></div><div class="st">✔ ${t('stampT')}</div><div><b>${esc(s.name)}</b>${s.pos?` · ${esc(s.pos)}`:''}</div><div class="mut">${esc(s.at)} · ${esc(s.method)} · ${esc(s.email)}</div><div class="ref">${t('ref')} ${esc(String(s.sh||'').slice(0,12))}</div></div>`:(M.status==='signing'&&REQ().includes(k)?`<div class="mut" style="margin-top:8px">${t('needsign')}</div>`:'')}
function overview(){
  const cl=clashList(M),bad=new Set();cl.forEach(x=>{bad.add(x.a.key);bad.add(x.b.key)});
  let h=cl.length?`<div class="warn"><b>${t('clash')}</b>${cl.map(x=>`<div>${RN(x.a.c)}: ${esc(x.a.r.activity)} ↔ ${RN(x.b.c)}: ${esc(x.b.r.activity)} — ${esc(x.why)}</div>`).join('')}</div>`:'';
  CODES.forEach(c=>{const rows=(M.con[c]&&M.con[c].rows)||[];
    h+=`<div class="card"><h2 style="border-left:6px solid ${COLORS[c]};padding-left:8px">${RN(c)}${rows.length?`<span class="tag ok">${t('entered')}</span>`:''}</h2>${rows.length&&M.con[c].name?`<div class="mut" style="margin:-4px 0 6px">${t('updby')} ${esc(M.con[c].name)}</div>`:''}`+(rows.length?`<table><tr><th>${t('area')}</th><th>${t('activity')}</th><th>${t('constraint')}</th></tr>`+rows.map((r,i)=>`<tr class="${bad.has(c+'#'+i)?'bad':''}"><td>${esc(r.area)}</td><td>${esc(r.activity)}${r.details?`<div class="mut">${esc(r.details)}</div>`:''}</td><td>${esc(r.constraint)}</td></tr>`).join('')+'</table>':`<div class="mut">${t('none')}</div>`)+sigLine(c)+'</div>'});

}

function bindPhotos(){
  document.querySelectorAll('.thumbs img').forEach(i=>i.onclick=()=>{$('#peek img').src=i.src;$('#peek').style.display='flex'});
  const d=$('#drop');if(!d)return;const inp=$('#phin');
  $('#addph').onclick=()=>inp.click();
  const up=async fs=>{for(const f of fs){if(!f.type.startsWith('image/'))continue;const r=await post({action:'photo',id:MID,...(HT?{ht:HT}:AUTH()),data:await lowres(f)});if(!r.ok)msg(r.error||t('err'))}load()};
  inp.onchange=()=>up(inp.files);
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');up(e.dataTransfer.files)};
}

const TYPO={en:{teh:'the',recieve:'receive',wich:'which',becuase:'because',seperate:'separate',equipement:'equipment',eqipment:'equipment',scafolding:'scaffolding',scaffolding:'scaffolding',sheduled:'scheduled',schedual:'schedule',activty:'activity',acitivity:'activity',crain:'crane',lifing:'lifting',weldin:'welding',tommorow:'tomorrow',tomorow:'tomorrow',untill:'until',adn:'and',wil:'will',dont:"don't",cant:"can't",wont:"won't",safty:'safety',hazzard:'hazard',pls:'please',plz:'please',abt:'about',w:'with',wiht:'with',taht:'that',thier:'their',occured:'occurred',begining:'beginning',maintainance:'maintenance',excavtion:'excavation',hydrotes:'hydrotest',comissioning:'commissioning',commisioning:'commissioning'},id:{yg:'yang',dgn:'dengan',utk:'untuk',tdk:'tidak',sdh:'sudah',blm:'belum',krn:'karena',dr:'dari',dlm:'dalam',pd:'pada',jg:'juga',sy:'saya',krj:'kerja',pekerjan:'pekerjaan',kegiatn:'kegiatan',pengerjan:'pengerjaan',besok:'besok',scafolding:'scaffolding',pengelasn:'pengelasan',pengangktan:'pengangkutan',peralatn:'peralatan',tdak:'tidak',sudh:'sudah',akn:'akan',dg:'dengan'},ms:{x:'tidak',tak:'tidak',yg:'yang',dgn:'dengan',utk:'untuk',krn:'kerana',dlm:'dalam',kerja:'kerja',esok:'esok',sbb:'sebab',jgk:'juga',sdh:'sudah',blm:'belum'}};
function basicFix(txt){
  let x=String(txt||'').replace(/[\t ]+/g,' ').replace(/ *\n */g,'\n').trim();
  x=x.replace(/\s+([,.;:!?])/g,'$1').replace(/([,;:!?])(?=[^\s\d"')\]])/g,'$1 ').replace(/\.(?=[A-Za-z])/g,'. ').replace(/([!?.,])\1+/g,'$1').replace(/\(\s+/g,'(').replace(/\s+\)/g,')');
  const map=Object.assign({},TYPO.en,TYPO[lang]||{});
  x=x.replace(/[A-Za-z']+/g,w=>{const k=w.toLowerCase();if(k==='w')return w;const r=map[k];if(!r||r===k)return w;return w===w.toUpperCase()&&w.length>1?r.toUpperCase():w[0]===w[0].toUpperCase()?r[0].toUpperCase()+r.slice(1):r});
  x=x.replace(/\bi\b(?=[ ',])/g,'I');
  x=x.replace(/(^|[.!?]\s+|\n)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  if(x&&!/[.!?]$/.test(x))x+='.';
  return x}

/* ---- dictionary spell check (lazy-loads dict.js; falls back to the small typo map if unavailable) ---- */
let SPELL=null,SPELLP=null;
function loadSpell(){if(SPELL)return Promise.resolve(SPELL);if(SPELLP)return SPELLP;
  SPELLP=new Promise(res=>{const sc=document.createElement('script');sc.src='dict.js?v='+VERSION;
    sc.onload=()=>{try{const D=window.DICT,mk=k=>{const m=new Map();D[k].split(' ').forEach((w,i)=>{if(!m.has(w))m.set(w,i)});return m};
      const dom=new Set((D.dom+' laydown lay-down tangki contractor contractors subcontractor mobilise mobilisation demobilise demobilisation mobilize crew manpower supervisor foreman operator operators barricade excavator pengelasan pengangkatan pemasangan pembongkaran pengiriman pengecoran penggalian perpipaan pengujian pembersihan pengecatan perawatan penerangan pekerjaan pelaksanaan persiapan pengamanan pengawasan material peralatan keselamatan').split(' '));Object.values(ACTS).flat().join(' ').toLowerCase().match(/[a-z]{2,}/g).forEach(w=>dom.add(w));
      SPELL={en:mk('en'),id:mk('id'),ms:mk('ms'),dom};res(SPELL)}catch(e){res(null)}};
    sc.onerror=()=>res(null);document.head.appendChild(sc);setTimeout(()=>res(SPELL),8000)});return SPELLP}
const ABC='abcdefghijklmnopqrstuvwxyz';
function edits1(w){const o=new Set(),n=w.length;
  for(let i=0;i<n;i++)o.add(w.slice(0,i)+w.slice(i+1));
  for(let i=0;i<n-1;i++)o.add(w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2));
  for(let i=0;i<n;i++)for(const c of ABC)o.add(w.slice(0,i)+c+w.slice(i+1));
  for(let i=0;i<=n;i++)for(const c of ABC)o.add(w.slice(0,i)+c+w.slice(i));
  o.delete(w);return o}
function spellWord(lw,S,order){
  const rk=w=>{if(S.dom.has(w))return -1;for(let i=0;i<order.length;i++){const r=S[order[i]].get(w);if(r!==undefined)return i*100000+r}return null};
  const own=rk(lw);
  if(own===-1)return null;
  let best=null,bs=1e12;
  const pick=set=>{for(const c of set){const sc=rk(c);if(sc!==null&&sc<bs){bs=sc;best=c}}};
  const e1=edits1(lw);pick(e1);
  if(own!==null){                                    // known word: only replace if it looks like a rare misspelling of a far more common/curated word
    const r0=own%100000;if(r0<4000||best===null)return null;
    const br=bs;return (br===-1||(br%100000<r0/40&&Math.floor(br/100000)<=Math.floor(own/100000)))?best:null}
  if(best===null&&lw.length>=7){for(const a of e1){pick(edits1(a))}}
  return best}
function spellFix(x,S){
  const order=lang==='id'?['id','en','ms']:lang==='ms'?['ms','en','id']:['en','id','ms'];
  return x.replace(/(^|[.!?]\s+|\n)?([A-Za-z]{4,})/g,(m,pre,w,off)=>{
    pre=pre||'';const start=!!pre||off===0;if(w===w.toUpperCase())return m;                      // acronyms
    const lw=w.toLowerCase();const cap=w[0]!==lw[0];
    if(cap&&!pre&&/[a-z]/.test(w.slice(1))&&false)return m;
    if(cap&&!start)return m;                                           // proper nouns / names mid-sentence
    const r=spellWord(lw,S,order);if(!r)return m;
    return pre+(cap?r[0].toUpperCase()+r.slice(1):r)})}
async function fixText(x){const S=await loadSpell();let n=basicFix(x);return S?basicFix(spellFix(n,S)):n}
async function regFix(els,bx){const prev=els.map(e=>e.value);let ch=0;bx.innerHTML=`<div class="mut">${t('polbusy')}</div>`;const S=await loadSpell();
  els.forEach(e=>{let n=basicFix(e.value);if(S&&n)n=basicFix(spellFix(n,S));if(e.value.trim()&&n!==e.value){e.value=n;ch++}});
  if(!ch){bx.innerHTML=`<div class="mut">${t('regsame')}</div>`;return}
  dirty=true;bx.innerHTML=`<div class="okb">${t('regdone')} <button type="button" class="btn sec ru">${t('regundo')}</button></div>`;
  bx.querySelector('.ru').onclick=()=>{els.forEach((e,i)=>e.value=prev[i]);bx.innerHTML=''}}
async function polishRow(d){
  const fs=[['.rd'],['.rc']];const ov=d.querySelector('.rbo');if(ov&&ov.style.display!=='none')fs.unshift(['.rbo']);
  const items=fs.map(([q])=>({el:d.querySelector(q),text:d.querySelector(q).value.trim()})).filter(x=>x.text.length>=3);
  const box=d.querySelector('.pres'),btn=d.querySelector('.pol');

  for(const [i,it] of items.entries()){if(r&&r.ok&&r.texts&&r.texts[i])out.push({el:it.el,old:it.text,neu:r.texts[i]});else{basic=true;out.push({el:it.el,old:it.text,neu:await fixText(it.text)})}}

  if(!ch.length){box.innerHTML=`<div class="okb">${t('polgood')}</div>`;return}
  box.innerHTML=`<div class="card" style="margin:6px 0">${basic?`<div class="mut" style="margin-bottom:6px">${t('polbasic')}</div>`:''}${ch.map(x=>`<div class="mut">${esc(x.old)}</div><div style="margin:2px 0 8px"><b>→ ${esc(x.neu)}</b></div>`).join('')}<button type="button" class="btn pu">${t('poluse')}</button><button type="button" class="btn sec pk">${t('polkeep')}</button></div>`;

  if(!r.sealed){$('#app').innerHTML=`<div class="card warn">${t('notsealed')}</div>`;return}
  const valid=r.contentOk&&r.sigs.every(s=>s.ok)&&(r.sealOk!==false);
  $('#app').innerHTML=`<div class="${valid?'okb':'badb'}"><b>${valid?t('vvalid'):t('vbad')}</b></div>
  <div class="card"><h2>${t('signers')} (${r.sigs.length}/${r.required})</h2><table><tr><th></th><th>${t('name')}</th><th>${t('email')}</th><th>${t('date')}</th><th>${t('method')}</th></tr>${r.sigs.map(s=>`<tr><td>${s.ok?'✓':'✗'}</td><td>${esc(s.label)}<br>${esc(s.name)}${s.pos?`<br><span class="mut">${esc(s.pos)}</span>`:''}</td><td>${esc(s.email)}</td><td>${esc(s.at)}</td><td>${esc(s.method)}</td></tr>`).join('')}</table>
  ${Object.keys(r.absent||{}).map(k=>`<div class="warn">${esc(t('role_'+k))}: ${t('absMarked')} (${t('absBy')} ${esc(t('role_'+r.absent[k].by))}, ${esc(r.absent[k].at)})</div>`).join('')}
  <p class="mono">${t('hash')}: ${r.H}<br>${t('seal')}: ${r.seal||'—'}</p><a class="btn sec" href="${BASE}?m=${VID}">${t('open')}</a></div>`;
}

/* ---------- LOAD ---------- */
async function load(){
  if(!API_URL){$('#app').innerHTML=`<div class="card warn">${t('noapi')}</div>`;return}
  if(VID)return verifyView();
  if(!MID)return home();
  let r;
  const ck='simopsM:'+MID+':'+(CC||'');
  if(!M){try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&c.meeting&&c.role!=='host'){M=c.meeting;role=c.role;if(role==='con')partyView();else publicView();}}catch(e){}}   // show the last seen version instantly while the fresh one loads
  if(!HT&&!TK&&CC&&CS()){r=await post({action:'get',id:MID,c:CC,s:CS()});if(!r.ok||r.role!=='con'){csClear();r=await get({action:'get',id:MID})}}
  else r=await get({action:'get',id:MID,ht:HT||'',c:CC||'',t:TK||''});
  if(!r.ok){$('#app').innerHTML=`<div class="card badb">${t('bad')}</div>`;return}
  M=r.meeting;role=r.role;
  if(M.status==='done'&&CC&&!TK&&!HT&&!sessionStorage.simopsChk){sessionStorage.simopsChk='1';const cu=await get({action:'current'});if(cu.ok&&cu.id&&cu.id!==MID){location.href=`${BASE}?m=${cu.id}&c=${CC}`;return}}
  if(r.role!=='host'){try{localStorage.setItem(ck,JSON.stringify({meeting:r.meeting,role:r.role}))}catch(e){}}
  if(role==='host')hostView();else if(role==='con')partyView();else publicView();
  dirty=false;
}
function setLang(l){lang=l;localStorage.simopsLang=l;document.documentElement.lang=l;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));load()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#peek').onclick=()=>$('#peek').style.display='none';
$('#app').addEventListener('input',()=>{dirty=true;saveDraft()});
$('#app').addEventListener('change',()=>saveDraft());
setInterval(()=>{const ae=document.activeElement;if(M&&!dirty&&MID&&!document.querySelector('.modal')&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))load()},30000);
setLang(lang);
</script>
</body>
